agent.sources  = r1
agent.sinks    = k1
agent.channels = c1

# ── SOURCE: netcat on port 44444 ─────────────────────────────────────────────
# Send a CSV line to this port and Flume will forward it to HBase.
# Usage from host: echo "row1,wk1,EU,FR,..." | nc localhost 44444
agent.sources.r1.type  = netcat
agent.sources.r1.bind  = 0.0.0.0
agent.sources.r1.port  = 44444
agent.sources.r1.channels = c1

# ── CHANNEL: memory ──────────────────────────────────────────────────────────
agent.channels.c1.type                = memory
agent.channels.c1.capacity            = 1000
agent.channels.c1.transactionCapacity = 1000

# ── SINK: HBase2Sink (required for HBase 2.x) ────────────────────────────────
agent.sinks.k1.type         = org.apache.flume.sink.hbase2.HBase2Sink
agent.sinks.k1.channel      = c1
agent.sinks.k1.table        = events
agent.sinks.k1.columnFamily = cf
agent.sinks.k1.batchSize    = 1

# Serializer: RegexHBase2EventSerializer
# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT FIXES vs your original config:
#
# 1. Serializer class must be the HBase2 variant:
#      org.apache.flume.sink.hbase2.RegexHBase2EventSerializer
#    NOT the async one (RegexHbaseAsyncEventSerializer) — that is HBase 1.x only
#    and is incompatible with HBase2Sink.
#
# 2. colNames must be plain column names only (no "cf:" prefix).
#    The columnFamily property above already scopes them to the 'cf' family.
#
# 3. The row key column is identified by rowKeyIndex (0-based index into colNames).
#    It is NOT written as a column — HBase uses it as the row identifier.
#    So colNames lists all 14 fields, and rowKeyIndex=0 tells Flume that
#    the first capture group (ROW_KEY) is the row key, not a column value.
# ─────────────────────────────────────────────────────────────────────────────
agent.sinks.k1.serializer = org.apache.flume.sink.hbase2.RegexHBase2EventSerializer

# Regex: 14 comma-separated fields (matches your original)
# Added ^ and $ anchors and \s* to handle trailing newlines from 'echo'
agent.sinks.k1.serializer.regex = ^([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*),([^,]*)\s*$

# Column names — plain names, no "cf:" prefix
agent.sinks.k1.serializer.colNames = ROW_KEY,week,region,country,admin1,event_type,sub_event_type,events,fatalities,population_exposure,disorder_type,id,latitude,longitude

# Group index (0-based) to use as the HBase row key
agent.sinks.k1.serializer.rowKeyIndex = 0