version: "3"

services:
  zookeeper:
    image: zookeeper:3.4.14
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    networks:
      - ubuntu_default

  hdfs-namenode:
    image: gradiant/hdfs-namenode:2.7.7
    container_name: hdfs-namenode
    env_file:
      - ./hadoop.env
    ports:
      - "50070:50070"
      - "8020:8020"
    volumes:
      - namenode_name:/hadoop/dfs/name
    networks:
      - ubuntu_default

  hdfs-datanode:
    image: gradiant/hdfs-datanode:2.7.7
    container_name: hdfs-datanode
    env_file:
      - ./hadoop.env
    depends_on:
      - hdfs-namenode
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks:
      - ubuntu_default

  hbase-master:
    image: gradiant/hbase-master
    container_name: hbase-master
    env_file:
      - ./hadoop.env
    ports:
      - "60010:60010"
      - "16000:16000"
    depends_on:
      - zookeeper
      - hdfs-namenode
    environment:
      - HBASE_CONF_hbase_zookeeper_quorum=zookeeper
      - HBASE_CONF_hbase_rootdir=hdfs://hdfs-namenode:8020/hbase
    networks:
      - ubuntu_default

  hbase-region:
    image: gradiant/hbase-region
    container_name: hbase-region
    env_file:
      - ./hadoop.env
    ports:
      - "16020:16020"
    depends_on:
      - hbase-master
    networks:
      - ubuntu_default

  mysql-db:
    image: mysql:8.0
    container_name: falcon-mysql
    environment:
      - ./hadoop.env
    ports:
      - "3306:3306"
    networks:
      - ubuntu_default

  news-fetcher:
    image: news-fetcher:1.0.0
    container_name: news-fetcher-service
    restart: always
    env_file:
      - ./hadoop.env
    ports:
      - "8081:8081"
    depends_on:
      - hbase-master

networks:
  ubuntu_default:
    external: true

volumes:
  namenode_name:
  datanode_data:
